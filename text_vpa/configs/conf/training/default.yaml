# Staged training protocol (Sec. 5.1). Select the stage with training.stage=planner|realizer|joint.
stage: planner
batch_size: 64
planner:                   # Stage 1: f_theta, pi_phi^h, g_phi with L_plan
  learning_rate: 3.0e-4
  warmup_steps: 2000
  weight_decay: 0.05
  max_steps: 100000        # also T_train of the EMA schedule (Eq. 4)
  grad_accum_steps: 1      # micro-batches per optimizer step
realizer:                  # Stage 2: planner frozen, condition on g_phi(s_x, u, Delta) only
  learning_rate: 3.0e-4
  warmup_steps: 5000
  weight_decay: 0.1
  max_steps: 300000
  grad_accum_steps: 1
joint:                     # Stage 3 (optional): planner at planner_lr_scale x learning_rate
  learning_rate: 1.0e-4
  warmup_steps: 1000
  weight_decay: 0.05
  max_steps: 50000
  grad_accum_steps: 1
  planner_lr_scale: 0.1
grad_clip_norm: 1.0
collapse_check_every: 1000 # stable-rank guard window (optimizer steps)
collapse_grace_steps: 1000 # srank is only logged before this step (no abort at initialisation)
seed: 0
device: auto               # cuda (incl. ROCm) > mps > cpu
precision: fp32
stage2_mode_source: reference   # mode u for g_phi in Stage 2 (the plan is always predicted from c)
readout_weight: 1.0
activation_checkpointing: false  # recompute realizer blocks in backward (saves memory)
realizer_loss_reduction: mean   # Eq. 12 averaged over positions ("sum": per-sample sum)
log_every: 10
save_every: 1000
