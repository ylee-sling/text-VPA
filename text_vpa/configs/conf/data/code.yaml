# Function-level Python corpus from text_vpa.data.corpus (spec -> function pairs, decontaminated).
language: python
tokenizer: bpe             # byte-level BPE trained on the corpus at Stage 1 (stored in every checkpoint)
tokenizer_name: null
bpe_vocab_size: 32768
mode_scheme: control_library   # 30 modes (planner=base has 64 >= 30)
max_context_tokens: 512
max_output_tokens: 512
max_structure_tokens: 1024
bucket_size: 32
time_sampling: grid
num_workers: 2             # collation workers (the dataset is built once, see --build-workers). Each forked worker
                           # copies ~2 KB per example over an epoch (reference counts), 4 GB at 2M functions;
                           # two keep up with the L4 (Stage 1 needs ~16 micro-batches/s, one worker gives ~40)
